name: Legacy Private CI - Manual Recovery Only

# Automatic verification for this private repository executes from
# GlacierEQ/public-actions-runner-host through the governed public action face.
# Keeping this workflow manual-only prevents private Actions budget from
# becoming an execution gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-manual-ci:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@main
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
